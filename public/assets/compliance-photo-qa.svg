<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#1a1a1a"/>

  <!-- Channel header -->
  <rect width="800" height="44" fill="#1e1e1e"/>
  <rect width="800" height="1" y="44" fill="#2d2d2d"/>
  <text x="20" y="27" fill="#ccc" font-size="14" font-weight="600"># compliance-photos</text>

  <!-- ── Worker message ── -->
  <!-- Avatar -->
  <rect x="20" y="60" width="36" height="36" rx="18" fill="#2d6a4f"/>
  <text x="38" y="83" text-anchor="middle" fill="white" font-size="14" font-weight="700">JA</text>

  <!-- Name + time -->
  <text x="66" y="75" fill="#e8e8e8" font-size="13" font-weight="700">James A.</text>
  <text x="130" y="75" fill="#555" font-size="12">9:41 AM</text>

  <!-- Message text -->
  <text x="66" y="95" fill="#ccc" font-size="13">ISL2 bay visit — Granary Square</text>

  <!-- Photo attachment -->
  <rect x="66" y="106" width="160" height="110" rx="6" fill="#1b4332"/>
  <rect x="66" y="106" width="160" height="110" rx="6" fill="none" stroke="#2d6a4f" stroke-width="1.5"/>
  <!-- Bike icon placeholder -->
  <text x="146" y="168" text-anchor="middle" fill="#52b788" font-size="36">🚲</text>
  <text x="146" y="195" text-anchor="middle" fill="#52b788" font-size="10">patrol_photo.jpg</text>

  <!-- ── Bot message ── -->
  <!-- Avatar -->
  <rect x="20" y="234" width="36" height="36" rx="6" fill="#1a56db"/>
  <text x="38" y="257" text-anchor="middle" fill="white" font-size="11" font-weight="700">AI</text>

  <!-- Bot name -->
  <text x="66" y="249" fill="#e8e8e8" font-size="13" font-weight="700">QA Bot</text>
  <rect x="120" y="237" width="28" height="14" rx="3" fill="#1a56db"/>
  <text x="134" y="248" text-anchor="middle" fill="white" font-size="8" font-weight="700">APP</text>
  <text x="156" y="249" fill="#555" font-size="12">9:41 AM</text>

  <!-- Attachment border -->
  <rect x="66" y="258" width="3" height="162" rx="1" fill="#2eb67d"/>

  <!-- Result card -->
  <rect x="69" y="258" width="700" height="162" fill="#1e1e1e"/>

  <!-- Pass badge -->
  <rect x="86" y="270" width="64" height="22" rx="11" fill="#1d3d2f"/>
  <text x="118" y="285" text-anchor="middle" fill="#2eb67d" font-size="11" font-weight="700">✅  PASS</text>

  <!-- Divider -->
  <rect x="86" y="302" width="666" height="1" fill="#2d2d2d"/>

  <!-- Check rows -->
  <text x="86" y="324" fill="#2eb67d" font-size="13">✓</text>
  <text x="106" y="324" fill="#ccc" font-size="13">Lime vehicle detected in frame</text>

  <text x="86" y="348" fill="#2eb67d" font-size="13">✓</text>
  <text x="106" y="348" fill="#ccc" font-size="13">Vehicle correctly parked at bay</text>

  <text x="86" y="372" fill="#2eb67d" font-size="13">✓</text>
  <text x="106" y="372" fill="#ccc" font-size="13">No obstruction or compliance issue identified</text>

  <!-- Divider -->
  <rect x="86" y="388" width="666" height="1" fill="#2d2d2d"/>

  <!-- Footer -->
  <text x="86" y="408" fill="#555" font-size="11">Analysed by Google Gemini Vision  ·  ISL2  ·  Granary Square  ·  09:41</text>
</svg>
